name: CineVerse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/admin-customer-management]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build (includes TanStack route generation)
        run: bun run build
      - name: Unit tests
        run: bun run test --passWithNoTests
